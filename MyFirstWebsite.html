<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mini Farming Simulator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #4caf50, #2e7d32);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .game-container {
      background: #263238;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      width: 650px;
      text-align: center;
    }
    h1 { color: #aed581; }
    .section {
      margin: 15px 0;
      padding: 15px;
      background: #37474f;
      border-radius: 10px;
    }
    .progress-bar {
      width: 100%;
      background: #455a64;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }
    .progress {
      height: 20px;
      width: 0%;
      background: linear-gradient(90deg, #ffeb3b, #fbc02d);
      transition: width 0.5s ease;
    }
    button {
      padding: 8px 12px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9em;
      transition: background 0.2s;
    }
    .plant { background: #4caf50; color: #fff; }
    .harvest { background: #ff9800; color: #fff; }
    .buy { background: #2196f3; color: #fff; }
    .sell { background: #9c27b0; color: #fff; }
    #coins, #inventory { margin-top: 10px; }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>🌱 Mini Farming Simulator</h1>
    <div id="coins">Coins: 100</div>

    <!-- Crop Fields -->
    <div class="section">
      <h3>Crop Fields</h3>
      <p>Spinach Field</p>
      <div class="progress-bar"><div class="progress" id="spinachProgress"></div></div>
      <button class="plant" onclick="plantCrop('spinach')">Plant Spinach</button>
      <button class="harvest" onclick="harvestCrop('spinach', 20)">Harvest (+20 coins)</button>
    </div>

    <div class="section">
      <p>Eggplant Field</p>
      <div class="progress-bar"><div class="progress" id="eggplantProgress"></div></div>
      <button class="plant" onclick="plantCrop('eggplant')">Plant Eggplant</button>
      <button class="harvest" onclick="harvestCrop('eggplant', 30)">Harvest (+30 coins)</button>
    </div>

    <!-- Inventory -->
    <div class="section" id="inventory">
      <h3>Inventory</h3>
      <p id="inventoryList">Empty</p>
    </div>

    <!-- Shop -->
    <div class="section">
      <h3>Shop</h3>
      <button class="buy" onclick="buyItem('spinachSeed', 10)">Buy Spinach Seed (10 coins)</button>
      <button class="buy" onclick="buyItem('eggplantSeed', 15)">Buy Eggplant Seed (15 coins)</button>
      <button class="buy" onclick="buyItem('fertilizer', 25)">Buy Fertilizer (25 coins)</button>
    </div>

    <!-- Upgrades -->
    <div class="section">
      <h3>Upgrades</h3>
      <button class="buy" onclick="buyUpgrade('fastGrowth', 50)">Faster Growth (50 coins)</button>
      <button class="buy" onclick="buyUpgrade('doubleHarvest', 75)">Double Harvest (75 coins)</button>
      <p id="upgradeStatus">No upgrades purchased.</p>
    </div>

    <!-- Marketplace -->
    <div class="section">
      <h3>Marketplace</h3>
      <button class="sell" onclick="sellCrop('spinach', 30)">Sell Spinach (+30 coins)</button>
      <button class="sell" onclick="sellCrop('eggplant', 40)">Sell Eggplant (+40 coins)</button>
      <button class="sell" onclick="tradeCrop('spinach','eggplant')">Trade Spinach for Eggplant</button>
    </div>
  </div>

  <script>
    let crops = {
      spinach: {growth: 0, growing: false, interval: null},
      eggplant: {growth: 0, growing: false, interval: null}
    };
    let inventory = [];
    let coins = 100;
    let growthSpeed = 1000;
    let doubleHarvest = false;

    function updateCoins() {
      document.getElementById('coins').innerText = 'Coins: ' + coins;
    }

    function plantCrop(type) {
      if (!crops[type].growing) {
        crops[type].growth = 0;
        document.getElementById(type + 'Progress').style.width = '0%';
        crops[type].growing = true;
        crops[type].interval = setInterval(() => {
          if (crops[type].growth < 100) {
            crops[type].growth += 10;
            document.getElementById(type + 'Progress').style.width = crops[type].growth + '%';
          } else {
            clearInterval(crops[type].interval);
          }
        }, growthSpeed);
      }
    }

    function harvestCrop(type, reward) {
      if (crops[type].growth === 100) {
        inventory.push(type);
        updateInventory();
        coins += doubleHarvest ? reward * 2 : reward;
        updateCoins();
        document.getElementById(type + 'Progress').style.width = '0%';
        crops[type].growing = false;
        crops[type].growth = 0;
      } else {
        alert(type + " not ready yet!");
      }
    }

    function updateInventory() {
      document.getElementById('inventoryList').innerText = inventory.length ? inventory.join(', ') : 'Empty';
    }

    function buyItem(item, cost) {
      if (coins >= cost) {
        coins -= cost;
        updateCoins();
        inventory.push(item);
        updateInventory();
      } else {
        alert("Not enough coins to buy " + item);
      }
    }

    function buyUpgrade(type, cost) {
      if (coins >= cost) {
        coins -= cost;
        updateCoins();
        if (type === 'fastGrowth') {
          growthSpeed = 500;
          document.getElementById('upgradeStatus').innerText = 'Faster Growth Active!';
        } else if (type === 'doubleHarvest') {
          doubleHarvest = true;
          document.getElementById('upgradeStatus').innerText = 'Double Harvest Active!';
        }
      } else {
        alert("Not enough coins for upgrade!");
      }
    }

    function sellCrop(type, price) {
      const index = inventory.indexOf(type);
      if (index !== -1) {
        inventory.splice(index, 1);
        coins += price;
        updateCoins();
        updateInventory();
      } else {
        alert("You don't have any " + type + " to sell!");
      }
    }

    function tradeCrop(fromType, toType) {
      const index = inventory.indexOf(fromType);
      if (index !== -1) {
        inventory.splice(index, 1);
        inventory.push(toType);
        updateInventory();
        alert("Traded " + fromType + " for " + toType + "!");
      } else {
        alert("You don't have any " + fromType + " to trade!");
      }
    }
  </script>
</body>
</html>
