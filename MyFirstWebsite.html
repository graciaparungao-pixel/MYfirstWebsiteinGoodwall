<div class="card controls">
  <h3>Interactive Controls</h3>
  
  <!-- Irrigation Control -->
  <div class="control">
    <label>Irrigation:</label>
    <button onclick="toggleIrrigation(true)">ON</button>
    <button onclick="toggleIrrigation(false)">OFF</button>
    <p id="irrigation-status">Status: OFF</p>
  </div>
  
  <!-- Nutrient Control -->
  <div class="control">
    <label>Nutrient Levels:</label>
    <input type="range" min="0" max="100" value="50" id="nutrient-slider">
    <p id="nutrient-status">Level: 50%</p>
  </div>
  
  <!-- Lighting Control -->
  <div class="control">
    <label>Lighting:</label>
    <button onclick="toggleLight(true)">ON</button>
    <button onclick="toggleLight(false)">OFF</button>
    <p id="light-status">Status: OFF</p>
  </div>
</div>

<script>
  function toggleIrrigation(state) {
    document.getElementById("irrigation-status").innerText = 
      "Status: " + (state ? "ON" : "OFF");
  }
  document.getElementById("nutrient-slider").addEventListener("input", function() {
    document.getElementById("nutrient-status").innerText = 
      "Level: " + this.value + "%";
  });
  function toggleLight(state) {
    document.getElementById("light-status").innerText = 
      "Status: " + (state ? "ON" : "OFF");
  }
</script>

<style>
  .controls .control {
    margin: 1rem 0;
    padding: 0.5rem;
    background: #f1f8e9;
    border-radius: 8px;
  }
  .controls button {
    margin: 0.2rem;
    padding: 0.5rem 1rem;
    background: #4caf50;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
  .controls button:hover {
    background: #388e3c;
  }
  .controls input[type=range] {
    width: 100%;
  }
</style>
