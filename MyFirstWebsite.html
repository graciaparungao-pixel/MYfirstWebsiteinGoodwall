<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modern Farming Game</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #2e7d32, #1b5e20);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .game-container {
      background: #263238;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      width: 350px;
      text-align: center;
    }
    h1 {
      margin-bottom: 20px;
      color: #aed581;
    }
    .field {
      margin: 20px 0;
      padding: 20px;
      background: #37474f;
      border-radius: 10px;
    }
    .progress-bar {
      width: 100%;
      background: #455a64;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }
    .progress {
      height: 20px;
      width: 0%;
      background: #ffeb3b;
      transition: width 0.3s;
    }
    button {
      padding: 10px 15px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
      transition: background 0.2s;
    }
    .plant {
      background: #4caf50;
      color: #fff;
    }
    .plant:hover {
      background: #388e3c;
    }
    .harvest {
      background: #ff9800;
      color: #fff;
    }
    .harvest:hover {
      background: #e65100;
    }
    #status {
      margin-top: 15px;
      font-weight: bold;
      color: #fff176;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>🌱 Farming Game</h1>
    <div class="field">
      <p>Crop Field</p>
      <div class="progress-bar">
        <div class="progress" id="progress"></div>
      </div>
    </div>
    <button class="plant" onclick="plantCrop()">Plant</button>
    <button class="harvest" onclick="harvestCrop()">Harvest</button>
    <div id="status">No crop planted yet.</div>
  </div>

  <script>
    let growth = 0;
    let growing = false;
    let interval;

    function plantCrop() {
      if (!growing) {
        growth = 0;
        document.getElementById('progress').style.width = '0%';
        document.getElementById('status').innerText = 'Crop planted! Growing...';
        growing = true;
        interval = setInterval(() => {
          if (growth < 100) {
            growth += 10;
            document.getElementById('progress').style.width = growth + '%';
          } else {
            document.getElementById('status').innerText = 'Crop is ready to harvest!';
            clearInterval(interval);
          }
        }, 1000);
      }
    }

    function harvestCrop() {
      if (growth === 100) {
        document.getElementById('status').innerText = 'You harvested the crop! 🌾';
        document.getElementById('progress').style.width = '0%';
        growing = false;
      } else {
        document.getElementById('status').innerText = 'Crop not ready yet!';
      }
    }
  </script>
</body>
</html>
